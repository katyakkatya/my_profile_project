<!DOCTYPE html>
<html lamg="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семестровая работа</title>
    <link rel="stylesheet" href="../style/styles.css">
    <style>
        /* Стили для модального окна */
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }
    
        dialog {
            border: none;
            border-radius: 12px;
            padding: 0;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            max-width: 500px;
            width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
        }
    
        .modal__header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px 12px 0 0;
            margin: 0;
        }
    
        .modal__header h2 {
            margin: 0;
            color: white;
            font-size: 1.5rem;
        }
    
        .modal__content {
            padding: 2rem;
        }
    
        .form__group {
            margin-bottom: 1.5rem;
        }
    
        .form__group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .form__group input,
        .form__group select,
        .form__group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        .form__group input:focus,
        .form__group select:focus,
        .form__group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form__group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .modal__actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .btn__primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn__primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn__secondary {
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e9ecef;
        }
        .btn__secondary:hover {
            background: #e9ecef;
        }
        .required {
            color: #e74c3c;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* Адаптивность */
        @media (max-width: 600px) {
            dialog {
                margin: 1rem;
                width: calc(100vw - 2rem);
            }

            .modal__actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="header">
            <h1 class="header__title">Контакты</h1>
        </header>
        <div class="under-header">
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a class="nav__link" href="../index.html">Главная</a></li>
                    <li class="nav__item"><a class="nav__link" href="../pages/news.html">Новости</a></li>
                    <li class="nav__item"><a class="nav__link" href="../pages/practices.html">Практики</a></li>
                    <li class="nav__item"><a class="nav__link" href="../pages/goods.html">Товары</a></li>
                    <li class="nav__item nav__item--active"><a class="nav__link" href="../pages/contacts.html">Контакты</a></li>
                </ul>
            </nav>
            <button class="btn-theme" type="button" onclick="toggleTheme()">🌙</button>
        </div>
        <main class="main">
            <div class="contacts">
                <h1 class="contacts__title">Контакты</h1>
                <article class="contact__info">
                    Адрес эл.почты: nusha@nusha.ru
                </article>
                <article class="contact__info">
                    Адрес: Земля, Страна смешариков, свой дом
                </article>
                <button class="contact__button" onclick="contactModal.showModal()">Позвоните мне</button>
            </div>
        </main>
        <footer class="footer">
            <p class="footer__text">&copy; 2025 Мой сайт</p>
        </footer>
        <!-- Модальное окно для формы обратной связи -->
        <dialog id="contactModal">
            <div class="modal__header">
                <h2>Форма обратной связи</h2>
            </div>
        
            <div class="modal__content">
                <form id="feedbackForm" method="dialog">
                    <div class="form__group">
                        <label for="name">Имя <span class="required">*</span>
                        </label>
                        <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
                    </div>
                    <div class="form__group">
                        <label for="phone">Телефон<span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" required placeholder="+7 (XXX) XXX-XX-XX">
                    </div>
                    <div class="form__group">
                        <label for="email">Электронная почта <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                    </div>
                    <div class="form__group">
                        <label for="category">Категория обращения <span class="required">*</span></label>
                        <select id="category" name="category" required>
                            <option value="">Выберите категорию</option>
                            <option value="technical">Техническая
                                поддержка</option>
                            <option value="commercial">Коммерческое
                                предложение</option>
                            <option value="cooperation">Сотрудничество</option>
                            <option value="complaint">Жалоба</option>
                            <option value="suggestion">Предложение</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>
                    <div class="form__group">
                        <label for="message">Текст обращения <span class="required">*</span></label>
                        <textarea id="message" name="message" required
                            placeholder="Опишите вашу проблему или вопрос..."></textarea>
                    </div>
                    <div class="modal__actions">
                        <!-- Кнопка отмены с автоматическим закрытием через
                    form method="dialog" -->
                        <button type="submit" class="btn btnsecondary">Отмена</button>
                        <!-- Кнопка отправки с обработкой через JavaScript -->
                        <button type="button" class="btn btn__primary" onclick="submitForm()">Отправить</button>
                    </div>
                </form>
            </div>
        </dialog>
        <script>
            // Функция для отправки формы
            function submitForm() {
                const form = document.getElementById('feedbackForm');
                const formData = new FormData(form);

                // Простая валидация
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                // Собираем данные формы
                const data = {
                    name: formData.get('name'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    category: formData.get('category'),
                    message: formData.get('message')
                };
                // В реальном приложении здесь был бы AJAX-запрос
                console.log('Данные формы:', data);

                // Показываем уведомление об успешной отправке
                alert('Спасибо! Ваше обращение отправлено. Мы свяжемся с вами в ближайшее время.');

            // Закрываем модальное окно
            contactModal.close();

                // Очищаем форму
                form.reset();
            }
            // Закрытие модального окна по клику на фон
            document.getElementById('contactModal').addEventListener('click',
                function (event) {
                    if (event.target === this) {
                        this.close();
                    }
                }
            );
            // Обработка отправки формы через Enter (предотвращаем стандартное поведение)
            document.getElementById('feedbackForm').addEventListener('keypress',
                function (event) {
                    if (event.key === 'Enter' && event.target.type !== 'textarea') {
                        event.preventDefault();
                    }
                }
            );
        </script>
    </div>
</body>
<script src="../js/theme.js"></script>
</html>
